[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lastra-convert"
version = "0.8.2"
description = "Python CLI to convert between Lastra and Parquet/CSV/Arrow. Mirror of QTSurfer/lastra-convert (Java)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Wualabs LTD" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    "lastra>=0.8",
    "pyarrow>=18",
    "pandas>=2.2",
]
keywords = ["lastra", "parquet", "csv", "arrow", "converter", "time-series"]

[project.urls]
Homepage = "https://github.com/QTSurfer/lastra-convert-py"
Documentation = "https://github.com/QTSurfer/lastra-convert-py#readme"
Repository = "https://github.com/QTSurfer/lastra-convert-py"
Issues = "https://github.com/QTSurfer/lastra-convert-py/issues"
"Reference (Java)" = "https://github.com/QTSurfer/lastra-convert"
"Format spec" = "https://github.com/QTSurfer/lastra-py/blob/main/FORMAT.md"

[project.scripts]
lastra2parquet = "lastra_convert.cli:lastra2parquet"
parquet2lastra = "lastra_convert.cli:parquet2lastra"
lastra2csv = "lastra_convert.cli:lastra2csv"
csv2lastra = "lastra_convert.cli:csv2lastra"
lastra2arrow = "lastra_convert.cli:lastra2arrow"
arrow2lastra = "lastra_convert.cli:arrow2lastra"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["lastra_convert"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
